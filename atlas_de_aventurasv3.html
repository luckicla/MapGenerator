<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2b2a22"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Atlas de Aventuras</title>
<style>
:root{--ink:#2d2a22;--paper:#f2e8cf;--panel:#efe4c8;--line:#cdbd97;--acc:#9a5b2e;--grn:#6d7f4f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#2b2a22;color:#f2e8cf;border-bottom:3px solid #a8884b}
h1{font:italic 24px 'IM Fell English',Georgia,serif;margin:0;white-space:nowrap}
#mapName{flex:1;max-width:340px;background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:6px;padding:6px 10px;font:italic 16px 'IM Fell English',Georgia,serif}
button{font:inherit;border:1px solid #bda877;background:#f8f0da;color:var(--ink);padding:7px 9px;border-radius:7px;cursor:pointer}
button:hover{background:#efe0b8}button.on{background:#dfe6c8;border-color:var(--grn);box-shadow:inset 0 0 0 1px var(--grn)}
button.big{background:var(--acc);color:#fff8e6;border-color:#7b4620;font-weight:600;width:100%;padding:11px;font-size:15px}button.big:hover{background:#85501f}
main{flex:1;display:grid;grid-template-columns:290px 1fr 270px;min-height:0}
aside{overflow:auto;padding:14px;background:var(--panel)}#L{border-right:1px solid var(--line)}#R{border-left:1px solid var(--line)}
aside h3{font:600 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:#7a6a45;margin:18px 0 8px}aside h3:first-child{margin-top:0}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}.presets button{text-align:left;padding:8px}
.sl{display:grid;grid-template-columns:1fr 36px;gap:0 6px;margin:10px 0}.sl label{grid-column:1/-1;font-size:13px}.sl input{width:100%;accent-color:var(--grn)}.sl output{text-align:right;font-size:12px;color:#7a6a45}
select,input[type=text],textarea{width:100%;font:inherit;padding:7px;border:1px solid #c8b98d;border-radius:6px;background:#fffaf0;color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1}.chk{display:flex;gap:6px;align-items:center;margin:6px 0;font-size:13px}
details{margin-top:14px}summary{cursor:pointer;font-size:13px;color:#7a6a45}details label{display:block;font-size:12px;margin:8px 0 3px}
#S{position:relative;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;flex-wrap:wrap;gap:5px;font-size:13px;align-items:center;padding:8px;background:#e6d9b6;border-bottom:1px solid var(--line)}
#bar .sp{flex:1}#types,#brushW{display:none;padding:6px 8px;background:#efe3c0;border-bottom:1px solid var(--line);gap:6px;flex-wrap:wrap;align-items:center}
#hint{padding:6px 12px;font-size:12.5px;background:#f7efd7;border-bottom:1px solid var(--line);color:#6b5d3b}
#cw{flex:1;min-height:0;position:relative;background:#bfb185}canvas{width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#2b2a22;color:#fff6df;padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:13px}#toast.show{opacity:1}
.card{background:#fff9ea;border:1px solid #d5c9a6;border-radius:8px;padding:12px;margin-bottom:12px}.card b.t{font:italic 19px 'IM Fell English',Georgia,serif;display:block}
.pl{display:flex;gap:8px;align-items:center;width:100%;text-align:left;margin-bottom:4px;padding:5px 8px}.pl small{color:#8a7b55;display:block;font-size:11px}
.hint2{font-size:12.5px;color:#6b5d3b}
#tabs,#sheet{display:none}
html,body{overscroll-behavior:none}
@media(max-width:800px){
body{height:100dvh}
header{padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));gap:8px}
h1{font-size:0}h1::before{content:"✥";font-size:24px}header>span{display:none}
#mapName{max-width:none;min-width:0;font-size:16px}
main{display:block;position:relative;flex:1;min-height:0}
#L,#R,#S{position:absolute;inset:0;display:none;border:0}
body[data-tab=mundo] #L,body[data-tab=lugares] #R{display:block}
body[data-tab=mapa] #S{display:flex}
#tabs{display:flex;background:#2b2a22;border-top:2px solid #a8884b;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;background:none;border:0;color:#d9cba6;padding:11px 4px;border-radius:0;font-size:13px}
#tabs button.on{color:#fff;background:#ffffff14;box-shadow:inset 0 3px 0 #a8884b}
#bar,#types{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}#bar button,#types button{flex:none;min-height:40px}#bar .sp{display:none}
button,select,input[type=text],textarea{min-height:40px;font-size:16px}
.presets button{padding:12px 8px}aside{padding-bottom:24px}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:52%;overflow:auto;background:var(--panel);border-top:3px solid var(--acc);padding:10px;z-index:5;box-shadow:0 -4px 14px #0004}
#sheet.show{display:block}#sheet .card{margin:0;border:0;background:none;padding:0}
}
</style></head><body data-tab="mapa">
<header><h1>✥ Atlas de Aventuras</h1><input id="mapName" value="Las Marcas de Eldoria" title="Nombre del mapa"><span style="flex:1"></span><button id="undo">↶ Deshacer</button></header>
<main>
<aside id="L">
 <h3>1 · Elige un tipo de mundo</h3><div class="presets" id="presets"></div>
 <h3>2 · Ajústalo a tu gusto</h3>

 <div class="sl"><label for="forest">Bosques</label><input id="forest" type="range" min="0" max="80" value="40"><output></output></div>
 <div class="sl"><label for="rivers">Ríos</label><input id="rivers" type="range" min="0" max="12" value="5"><output></output></div>

 <button class="big" id="newWorld">🎲 Mundo nuevo</button>
 <h3>3 · Aspecto</h3>
 <select id="style"><option value="perg">Pergamino clásico</option><option value="cuento">Libro de cuentos</option><option value="sombrio">Fantasía sombría</option></select>
 <div class="row"><select id="names"><option value="fantasia">Nombres: clásicos</option><option value="elfico">Élficos</option><option value="nordico">Nórdicos</option><option value="arabe">Desérticos</option><option value="celta">Celtas</option></select></div>
 <label class="chk"><input type="checkbox" id="showNames" checked> Mostrar nombres</label>
 <label class="chk"><input type="checkbox" id="showRoads" checked> Mostrar caminos</label>
 <details><summary>Opciones avanzadas</summary>
  <label>Semilla (misma semilla = mismo mundo)</label><input type="text" id="seed">
  <label>Formato</label><select id="fmt"><option value="l">Apaisado</option><option value="p">Vertical</option></select>
  <label>Tamaño del PNG</label><select id="res"><option value="1600">Normal (1600 px)</option><option value="2400" selected>Alto (2400 px)</option><option value="3200">Impresión (3200 px)</option></select>
  <label class="chk"><input type="checkbox" id="showCompass" checked> Rosa de los vientos</label>
 </details>
 <h3>Guardar</h3>
 <div class="row"><button id="png" class="on">⬇ PNG</button><button id="json">Guardar</button><button id="load">Abrir…</button></div>
 <div class="row"><button id="share">📤 Compartir imagen</button></div>
 <input type="file" id="file" accept=".json,application/json" hidden>
</aside>
<div id="S">
 <div id="bar"></div>
 <div id="brushW"><span>Tamaño del pincel</span><input type="range" id="brush" min="1" max="9" value="4" style="width:140px"><label class="chk"><input type="checkbox" id="erz"> Quitar</label></div>
 <div id="types"></div>
 <div id="hint"></div>
 <div id="cw"><canvas id="cv"></canvas><div id="toast"></div></div>
 <div id="sheet"></div>
</div>
<aside id="R"><div id="card"></div><h3>Lugares del mapa</h3><div id="list"></div></aside>
</main>
<nav id="tabs"><button data-tab="mundo">🌍 Mundo</button><button data-tab="mapa" class="on">🗺 Mapa</button><button data-tab="lugares">📍 Lugares</button></nav>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),cv=$("cv"),CELL=10;
let W=1600,H=1100,GW=160,GH=110,M={seed:1,hh:null,mo:null,mt:9,ft:9,places:[],rivers:[],roads:[]},shape="c",ground="grass",tool="move",ptype="town",sel=null,landCv=null,view={x:0,y:0,k:1},hist=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,pick=(r,a)=>a[Math.floor(r()*a.length)],ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
function rng(s){let a=s>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function H1(x,y,s){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041);n=Math.imul(n^n>>>13,1274126177);return((n^n>>>16)>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(H1(xi,yi,s),H1(xi+1,yi,s),u),lerp(H1(xi,yi+1,s),H1(xi+1,yi+1,s),u),v)}
function fbm(x,y,s){let a=.5,f=1,t=0,n=0;for(let i=0;i<5;i++){t+=a*vn(x*f,y*f,s+i*17);n+=a;a/=2;f*=2}return t/n}
const quant=(arr,p)=>{const s=Float32Array.from(arr).sort();return s.length?s[clamp(Math.floor(p*(s.length-1)),0,s.length-1)]:9};
function E(gx,gy,A){A=A||M.hh;gx=clamp(gx-.5,0,GW-1.001);gy=clamp(gy-.5,0,GH-1.001);const x=gx|0,y=gy|0,fx=gx-x,fy=gy-y,i=y*GW+x;return A[i]*(1-fx)*(1-fy)+A[i+1]*fx*(1-fy)+A[i+GW]*(1-fx)*fy+A[i+GW+1]*fx*fy}
function toast(s){const e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1700)}

/* ---------- datos ---------- */
const BIO={templado:{ic:"🌳",n:"Templado",v:{land:55,mount:18,forest:40,rivers:5,civ:5,adv:5},s:"c",g:"grass"},islas:{ic:"🏝",n:"Archipiélago",v:{land:34,mount:10,forest:35,rivers:2,civ:4,adv:5},s:"i",g:"grass"},montanas:{ic:"⛰",n:"Montañoso",v:{land:60,mount:42,forest:30,rivers:7,civ:3,adv:6},s:"c",g:"grass"},desierto:{ic:"🏜",n:"Desierto",v:{land:62,mount:14,forest:2,rivers:1,civ:3,adv:7},s:"c",g:"sand"},nieve:{ic:"❄",n:"Tierras nevadas",v:{land:58,mount:26,forest:35,rivers:4,civ:3,adv:5},s:"c",g:"snow"},jungla:{ic:"🌴",n:"Jungla",v:{land:58,mount:10,forest:78,rivers:9,civ:3,adv:7},s:"c",g:"jungle"},volcan:{ic:"🌋",n:"Volcánico",v:{land:48,mount:34,forest:6,rivers:2,civ:3,adv:8},s:"i",g:"ash"}};
const GR={grass:{land:[207,208,150],sand:[233,219,166],forest:[148,170,108],rock:[176,170,150]},sand:{land:[232,208,152],sand:[242,227,178],forest:[190,186,120],rock:[194,168,128]},snow:{land:[240,240,230],sand:[226,231,232],forest:[188,205,196],rock:[202,204,210]},ash:{land:[158,147,130],sand:[186,171,146],forest:[118,120,96],rock:[108,99,98]},jungle:{land:[170,196,114],sand:[226,214,160],forest:[104,148,82],rock:[160,160,134]}};
const STY={perg:{paper:"#f0e3c4",ink:"#3a3326",sea:[176,202,198],deep:[126,166,172],sat:1,br:1},cuento:{paper:"#f6ebd0",ink:"#33422f",sea:[146,206,210],deep:[96,170,192],sat:1.25,br:1.03},sombrio:{paper:"#d8cfba",ink:"#2c2a26",sea:[138,154,150],deep:[92,110,112],sat:.65,br:.9}};
const NM={fantasia:[["Ael","Bel","Bran","Dun","Eld","Fal","Gal","Grim","Kael","Mor","Nor","Rav","Thal","Val"],["dor","fall","gard","haven","mere","moor","reach","spire","watch","wick","wyn","oria"]],elfico:[["Ael","Ari","Cele","Eli","Fael","Ithil","Loth","Mira","Nim","Syla","Tira","Vana"],["anor","ara","driel","loth","lume","riel","thalas","wen","wyn"]],nordico:[["Bjorn","Draug","Eik","Frost","Gald","Hrafn","Jarn","Kald","Runa","Skal","Storm","Ulf"],["berg","dal","fjord","gard","heim","holm","mark","vik","skar","fell"]],arabe:[["Akh","Amar","Az","Bah","Dar","Far","Jaz","Khar","Nad","Qas","Rah","Zul"],["abad","akh","al","esh","hara","im","ir","qad","sara"]],celta:[["Aver","Bran","Caer","Celyn","Dun","Eira","Glen","Llan","Morna","Pen","Rhos","Taran"],["bryn","combe","dun","mere","more","rath","wick","wen","wych","yr"]]};
const TL={city:"Ciudad",town:"Pueblo",castle:"Castillo",ruin:"Ruinas",dungeon:"Mazmorra",dragon:"Guarida de monstruo",treasure:"Tesoro",landmark:"Lugar singular"},TE={city:"🏛",town:"🏘",castle:"🏰",ruin:"🏚",dungeon:"🕳",dragon:"🐉",treasure:"💰",landmark:"🗿"};
const HK={s:["Alguien roba provisiones y el alcalde culpa a los forasteros.","Una familia noble oculta un pacto con una facción rival.","Los vecinos hablan de luces extrañas junto al cementerio.","Se busca escolta para una caravana por territorio peligroso.","Un posadero guarda un mapa que no sabe leer."],d:["Una cripta sellada: algo golpea desde dentro cada luna nueva.","Un culto usa estas galerías para sus rituales.","Trampas antiguas protegen una reliquia de la que nadie habla.","Goblins y kobolds se disputan la entrada."],g:["Una criatura ancestral duerme sobre un tesoro. Las huellas sugieren que no está sola.","Los pastores desaparecen cada vez que cae la niebla."],t:["Un cofre enterrado bajo una piedra marcada con un símbolo.","Una bolsa con monedas y una carta que compromete a un noble."],l:["Los viajeros dejan ofrendas aquí antes de seguir camino.","Un lugar donde los mapas no coinciden con el terreno."]};
const hookFor=(t,r)=>pick(r,HK[{city:"s",town:"s",castle:"s",ruin:"d",dungeon:"d",dragon:"g",treasure:"t",landmark:"l"}[t]]);
function nameFor(t,r){const w=NM[$("names").value]||NM.fantasia,b=pick(r,w[0])+pick(r,w[1]);return({ruin:"Ruinas de ",dungeon:pick(r,["Cripta de ","Cavernas de ","Mazmorra de "]),castle:pick(r,["Castillo de ","Fortaleza de "]),dragon:"Guarida de ",treasure:"Tesoro de ",landmark:pick(r,["Piedras de ","Faro de ","Roble de "])}[t]||"")+b}

/* ---------- generación ---------- */
function seedVal(){const v=$("seed").value.trim();if(!v)return 1;if(/^\d+$/.test(v))return+v;let h=2166136261;for(const c of v)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function dims(){const p=$("fmt").value==="p";W=p?1100:1600;H=p?1600:1100;GW=W/CELL;GH=H/CELL}
function gen(newSeed){snap();dims();if(newSeed||!$("seed").value)$("seed").value=Math.floor(Math.random()*900000+100000);
 const seed=M.seed=seedVal(),land=+$("land").value/100,mount=+$("mount").value/100,forest=+$("forest").value/100,sx=GW/GH,isl=shape==="i",hh=new Float32Array(GW*GH),mo=new Float32Array(GW*GH);
 for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const nx=(gx+.5)/GW,ny=(gy+.5)/GH,f=isl?2.4:1.5,base=fbm(nx*2.2*sx*f,ny*2.2*f,seed),d=Math.hypot((nx-.5)*2,(ny-.5)*2),mask=isl?1-Math.pow(d,1.5)*.8:1-Math.pow(d,2.3)*.95,ridge=1-Math.abs(vn(nx*5*sx,ny*5,seed+50)*2-1),i=gy*GW+gx;
  hh[i]=base*.7+ridge*.18*(.4+mount*1.5)+mask*(isl?.22:.5);mo[i]=fbm(nx*4*sx+7,ny*4+7,seed+99)}
 const sea=quant(hh,1-land);for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const i=gy*GW+gx,ed=Math.min(gx,gy,GW-1-gx,GH-1-gy);hh[i]-=sea;if(ed<6)hh[i]-=(1-ed/6)*.45}
 const lv=[],mv=[];for(let i=0;i<hh.length;i++)if(hh[i]>0){lv.push(hh[i]);mv.push(mo[i])}
 M.hh=hh;M.mo=mo;M.mt=mount<.005?9:quant(lv,1-mount);M.ft=forest<.005?9:quant(mv,1-forest);
 M.places=[];sel=null;mkPlaces();mkRivers();mkRoads();render();side()}
function nearWater(gx,gy,R){for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++)if(E(gx+x,gy+y)<=0)return true;return false}
function spot(t,r){let best=null,bs=-9;const md={city:14,town:7,castle:10}[t]||4;
 for(let k=0;k<70;k++){const gx=5+r()*(GW-10),gy=5+r()*(GH-10),e=E(gx,gy);if(e<.04||M.places.some(p=>Math.hypot(p.x/CELL-gx,p.y/CELL-gy)<md))continue;
  const m=e>M.mt,fo=E(gx,gy,M.mo)>M.ft;let s=r()*.5;
  if(t==="city"||t==="town")s+=(nearWater(gx,gy,4)?1:0)+(m?-2:0)+(fo?-.5:0);else if(t==="dragon")s+=m?2:e>M.mt*.6?1:0;else if(t==="ruin"||t==="dungeon")s+=(m||fo)?1:0;else if(t==="castle")s+=e>.12?.6:0;
  if(s>bs){bs=s;best=[gx,gy]}}return best}
function addPlace(t,r,at){const p=at||spot(t,r);if(!p)return null;const o={id:"p"+Math.random().toString(36).slice(2,8),type:t,x:p[0]*CELL,y:p[1]*CELL,name:nameFor(t,r),note:hookFor(t,r),danger:t==="dragon"?ri(r,7,10):ri(r,1,t==="city"||t==="town"?4:9)};M.places.push(o);return o}
function mkPlaces(){const c=+$("civ").value,a=+$("adv").value,seed=M.seed,spec=[["city",Math.round(c*.35)],["town",c*2],["castle",Math.round(c*.3)],["ruin",a],["dungeon",Math.round(a*.6)],["dragon",Math.round(a*.3)],["treasure",a],["landmark",Math.round(a*.5)]];
 spec.forEach(([t,n],j)=>{const r=rng(seed*7+j*101);for(let i=0;i<n;i++)addPlace(t,r)})}
function mkRivers(){M.rivers=[];const r=rng(M.seed+777),n=+$("rivers").value,src=[];for(let y=4;y<GH-4;y++)for(let x=4;x<GW-4;x++)if(M.hh[y*GW+x]>M.mt*.6&&M.hh[y*GW+x]>.15)src.push([x,y]);if(!src.length)return;
 for(let k=0;k<n*3&&M.rivers.length<n;k++){let [x,y]=pick(r,src);const seen=new Set([x+","+y]),pts=[[x,y]];
  for(let st=0;st<320;st++){let b=null,bv=9;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if((!dx&&!dy)||nx<1||ny<1||nx>=GW-1||ny>=GH-1||seen.has(nx+","+ny))continue;const v=M.hh[ny*GW+nx]+r()*.025;if(v<bv){bv=v;b=[nx,ny]}}if(!b)break;[x,y]=b;seen.add(x+","+y);pts.push(b);if(M.hh[y*GW+x]<=0)break}
  const f0=pts[0],reach=Math.max(Math.abs(f0[0]-x),Math.abs(f0[1]-y));if(M.hh[y*GW+x]<=0&&pts.length>12&&pts.length<reach*1.7+8)M.rivers.push(pts.map(p=>[(p[0]+.5)*CELL,(p[1]+.5)*CELL]))}}
function mkRoads(){M.roads=[];const S=M.places.filter(p=>["city","town","castle"].includes(p.type)),ok=(a,b)=>{for(let i=1;i<14;i++){if(E((a.x+(b.x-a.x)*i/14)/CELL,(a.y+(b.y-a.y)*i/14)/CELL)<.01)return false}return true},has=(a,b)=>M.roads.some(q=>(q[0]===a&&q[1]===b)||(q[0]===b&&q[1]===a));

/* ---------- panel derecho ---------- */
function side(){const p=M.places.find(p=>p.id===sel);
 $("card").innerHTML=p?`<div class="card"><small>${TE[p.type]} ${TL[p.type]}</small><input type="text" id="pn" value="${esc(p.name)}" placeholder="Nombre" style="margin:6px 0"><label class="hint2">Peligro: <b id="dv">${p.danger}</b>/10</label><input type="range" id="pd" min="1" max="10" value="${p.danger}" style="width:100%;accent-color:#a4513c"><label class="hint2">Notas, rumores y misiones</label><textarea id="pt" rows="6">${esc(p.note)}</textarea><div class="row"><button id="pr">🎲 Otra idea</button><button id="px">🗑 Eliminar</button></div></div>`:`<div class="card"><b class="t">Cuaderno del cartógrafo</b><p class="hint2">Toca cualquier lugar del mapa para ver y editar su ficha: nombre, peligro y notas para tu partida.</p><p class="hint2">Para añadir más, usa <b>📍 Poner lugar</b> en la barra de arriba.</p></div>`;
 if(p){$("pn").oninput=e=>{p.name=e.target.value;draw();list()};$("pt").oninput=e=>p.note=e.target.value;$("pd").oninput=e=>{p.danger=+e.target.value;$("dv").textContent=p.danger};
  $("pr").onclick=()=>{const r=Math.random;p.note=hookFor(p.type,r);p.name=nameFor(p.type,r);side();draw()};$("px").onclick=()=>{snap();M.places=M.places.filter(q=>q!==p);sel=null;mkRoads();render();side()}}
 list()}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function list(){$("list").innerHTML=M.places.map(p=>`<button class="pl ${p.id===sel?"on":""}" data-id="${p.id}"><span>${TE[p.type]}</span><span>${esc(p.name||TL[p.type])}<small>${TL[p.type]}</small></span></button>`).join("")||'<p class="hint2">Aún no hay lugares.</p>'}
$("list").onclick=e=>{const b=e.target.closest("[data-id]");if(b){sel=b.dataset.id;side();draw()}};

/* ---------- historial, guardar, cargar ---------- */
function snap(){hist.push({hh:M.hh&&M.hh.slice(),mo:M.mo&&M.mo.slice(),pl:JSON.stringify(M.places),mt:M.mt,ft:M.ft,seed:M.seed,W,H});if(hist.length>20)hist.shift()}
function undo(){const h=hist.pop();if(!h||!h.hh){toast("Nada que deshacer");return}W=h.W;H=h.H;GW=W/CELL;GH=H/CELL;Object.assign(M,{hh:h.hh,mo:h.mo,places:JSON.parse(h.pl),mt:h.mt,ft:h.ft,seed:h.seed});sel=null;mkRivers();mkRoads();render();side();toast("Deshecho")}
const IDS=["land","mount","forest","rivers","civ","adv","style","names","seed","fmt","res"],CK=["showNames","showRoads","showCompass"];
function png(share){const s=+$("res").value/W,cn=document.createElement("canvas");cn.width=Math.round(W*s);cn.height=Math.round(H*s);const c=cn.getContext("2d");c.drawImage(land(s),0,0);c.scale(s,s);overlay(c);frame(c);const a=document.createElement("a");a.download=($("mapName").value||"mapa").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".png";if(share&&navigator.canShare){cn.toBlob(b=>{const f=new File([b],a.download,{type:"image/png"});if(navigator.canShare({files:[f]}))navigator.share({files:[f],title:$("mapName").value}).catch(()=>{});else toast("Este navegador no puede compartir archivos")},"image/png");return}a.href=cn.toDataURL("image/png");a.click();toast("PNG descargado")}
function pack(){return {v:3,name:$("mapName").value,shape,ground,W,H,seed:M.seed,mt:M.mt,ft:M.ft,hh:Array.from(M.hh,v=>Math.round(v*1000)),mo:Array.from(M.mo,v=>Math.round(v*1000)),places:M.places,s:Object.fromEntries([...IDS.map(i=>[i,$(i).value]),...CK.map(i=>[i,$(i).checked])])}}
function save(){const d=pack(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download="atlas-"+Date.now()+".json";a.click();toast("Mapa guardado")}
function open(f){const r=new FileReader();r.onload=()=>{try{loadData(JSON.parse(r.result));toast("Mapa abierto")}catch(e){alert("Ese archivo no es un mapa del Atlas.")}};r.readAsText(f)}
function loadData(d){if(d.v!==3)throw 0;shape=d.shape;ground=d.ground;for(const[k,v]of Object.entries(d.s)){const el=$(k);if(el.type==="checkbox")el.checked=v;else el.value=v}$("mapName").value=d.name;dims();M={seed:d.seed,mt:d.mt,ft:d.ft,hh:Float32Array.from(d.hh,v=>v/1000),mo:Float32Array.from(d.mo,v=>v/1000),places:d.places,rivers:[],roads:[]};sel=null;outs();mkRivers();mkRoads();fit();render();side()}

/* ---------- conexión de controles ---------- */
const outs=()=>document.querySelectorAll(".sl").forEach(s=>s.querySelector("output").textContent=s.querySelector("input").value+(["land","mount","forest"].includes(s.querySelector("input").id)?"%":""));
let deb;document.querySelectorAll(".sl input").forEach(i=>i.addEventListener("input",()=>{outs();clearTimeout(deb);deb=setTimeout(()=>gen(false),140)}));
function applyBio(k){if(k==="rnd")k=pick(Math.random,Object.keys(BIO));const b=BIO[k];Object.entries(b.v).forEach(([i,v])=>$(i).value=v);shape=b.s;ground=b.g;outs();document.querySelectorAll("[data-b]").forEach(x=>x.classList.toggle("on",x.dataset.b===k));gen(true)}
$("presets").onclick=e=>{const b=e.target.closest("[data-b]");if(b)applyBio(b.dataset.b)};
$("bar").onclick=e=>{const b=e.target.closest("[data-t]");if(b)setTool(b.dataset.t);if(e.target.id==="zi")zoomBy(1.25);if(e.target.id==="zo")zoomBy(.8);if(e.target.id==="ctr"){fit();draw()}};
$("types").onclick=e=>{const b=e.target.closest("[data-p]");if(b){ptype=b.dataset.p;setTool("place")}};
$("newWorld").onclick=()=>gen(true);$("undo").onclick=undo;$("png").onclick=()=>png(false);$("json").onclick=save;$("load").onclick=()=>$("file").click();$("file").onchange=e=>{if(e.target.files[0])open(e.target.files[0]);e.target.value=""};
["style","showNames","showRoads","showCompass","mapName"].forEach(i=>$(i).addEventListener("input",()=>draw()));$("style").addEventListener("change",()=>render());
$("names").onchange=()=>{snap();const r=rng(M.seed+5);M.places.forEach(p=>p.name=nameFor(p.type,r));side();draw()};
$("seed").onchange=()=>gen(false);$("fmt").onchange=()=>{gen(false);fit();draw()};
addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();undo()}if((e.key==="Delete"||e.key==="Backspace")&&sel){snap();M.places=M.places.filter(p=>p.id!==sel);sel=null;mkRoads();render();side()}});
let lw=innerWidth;addEventListener("resize",()=>{if(innerWidth!==lw){lw=innerWidth;fit()}draw()});
const mob=()=>matchMedia("(max-width:800px)").matches;let tab="mapa";const sheet=$("sheet");
function setTab(t){tab=t;document.body.dataset.tab=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));if(t==="mapa")requestAnimationFrame(()=>{if(!view.k0)fit();draw();side()})}
$("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab)};
function layout(){(mob()?sheet:$("R")).prepend($("card"));side()}
const _side=side;side=function(){_side();const p=M.places.find(q=>q.id===sel),on=mob()&&tab==="mapa"&&!!p;sheet.classList.toggle("show",on);if(on){const r=rc(),sy=p.y*view.k+view.y,lim=r.height*.38;if(sy>lim||sy<20){view.y+=lim-sy;draw()}}};
$("newWorld").addEventListener("click",()=>{if(mob())setTab("mapa")});
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(!b||!mob())return;const p=M.places.find(q=>q.id===b.dataset.id);setTab("mapa");if(p)requestAnimationFrame(()=>{const r=rc();view.k=Math.max(view.k,view.k0*1.6);view.x=r.width/2-p.x*view.k;view.y=r.height*.25-p.y*view.k;draw();side()})});
$("erz").onchange=e=>{erz=e.target.checked};$("share").onclick=()=>png(true);
function autosave(){try{localStorage.setItem("atlas-auto",JSON.stringify(pack()))}catch(e){}}
buildUI();outs();document.querySelector('[data-b="templado"]').classList.add("on");fit();gen(true);hist.length=0;fit();draw();
layout();matchMedia("(max-width:800px)").addEventListener("change",layout);
try{const s=localStorage.getItem("atlas-auto");if(s){loadData(JSON.parse(s));hist.length=0;toast("Mapa recuperado")}}catch(e){}
setInterval(autosave,8000);addEventListener("pagehide",autosave);document.addEventListener("visibilitychange",()=>{if(document.hidden)autosave()});
})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
